<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="estilo.css">
<style>
  .texto { position: absolute; left: 72px; top: 72px; width: 1056px; }
  .texto h1 { margin-top: 30px; }
  .texto .sub { margin-top: 22px; width: 860px; }
  .cel { left: 96px; top: 480px; transform: rotate(-7deg); }
  .ondas { position: absolute; left: 432px; top: 655px; width: 120px; height: 120px; }
  .ventana.app { left: 568px; top: 440px; width: 552px; height: 598px; }
  .ventana.app img { width: 552px; }
  .cursor { position: absolute; left: 862px; top: 684px; width: 46px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
</style></head>
<body>
  <div class="grano"></div>
  <div class="texto">
    <span class="pill">Gratis <i></i> En español <i></i> Código abierto</span>
    <h1>Tu celular, en la<br><em>pantalla del PC</em></h1>
    <p class="sub">Manéjalo con el mouse y el teclado,<br>por tu propio wifi. Sin cables ni cuentas.</p>
  </div>

  <div class="cel"><div class="camara"></div><div class="pantalla">
    <div class="hora">10:24</div><div class="fecha">miércoles 25 de noviembre</div>
    <div class="apps"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
  </div></div>

  <!-- ondas wifi que salen del celular hacia el PC -->
  <svg class="ondas" viewBox="0 0 120 120" fill="none" stroke="#93c5fd" stroke-width="9" stroke-linecap="round">
    <circle cx="20" cy="60" r="8" fill="#93c5fd" stroke="none"/>
    <path d="M44 38 A30 30 0 0 1 44 82"/>
    <path d="M66 22 A52 52 0 0 1 66 98" opacity=".7"/>
    <path d="M88 8 A74 74 0 0 1 88 112" opacity=".4"/>
  </svg>

  <div class="ventana app">
    <img src="cap-principal.png">
    <!-- tapa la IP local -->
    <div class="tapa" style="left:196px; top:170px; width:300px; height:24px;"></div>
  </div>

  <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15 L12.5 22 L15.5 20.6 L12 13.8 L19 13.8 Z" fill="#fff" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/></svg>

  <div class="pie">
    <div class="marca"><img src="../EspejoCelular/icono-256.png"> Espejo Celular</div>
    <span class="url">github.com/pafifo/espejo-celular</span>
  </div>
</body></html>
